name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: git diff --exit-code -- dist/index.js
      - run: bun audit --production

  omp-host-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        omp-version:
          - "18.4.4"
          - "18.4.5"
          - "18.4.9"
          - "18.14.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install isolated OMP host
        run: |
          mkdir -p "$RUNNER_TEMP/omp-host"
          cd "$RUNNER_TEMP/omp-host"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@oh-my-pi/pi-coding-agent@${{ matrix.omp-version }}" "@oh-my-pi/pi-ai@${{ matrix.omp-version }}" "@oh-my-pi/pi-catalog@${{ matrix.omp-version }}"
      - name: Smoke test the dependency-free Git installation entry
        env:
          OMP: ${{ runner.temp }}/omp-host/node_modules/.bin/omp
          HOME: ${{ runner.temp }}/alias-home
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/alias-agent
        run: |
          "$OMP" --version
          mkdir -p "$HOME" "$PI_CODING_AGENT_DIR" "$RUNNER_TEMP/consumer/dist"
          cp package.json "$RUNNER_TEMP/consumer/package.json"
          cp dist/index.js "$RUNNER_TEMP/consumer/dist/index.js"
          cat >"$PI_CODING_AGENT_DIR/omp-sub-alias.json" <<'JSON'
          {"aliases":[{"provider":"openai-codex","slug":"pro","label":"Codex Pro"}]}
          JSON
          cat >"$PI_CODING_AGENT_DIR/models.yml" <<'JSON'
          {"providers":{"test":{"baseUrl":"http://127.0.0.1:9/v1","apiKey":"isolated-nonsecret","api":"openai-completions","models":[{"id":"test","name":"test","api":"openai-completions","reasoning":true,"input":["text"],"contextWindow":524288,"maxTokens":16384,"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0}}]}}}
          JSON
          cat >"$PI_CODING_AGENT_DIR/config.yml" <<'JSON'
          {"enabledProviders":["test"],"enabledModels":["test/test"],"modelRoles":{"default":"test/test","smol":"test/test","slow":"test/test","plan":"test/test"}}
          JSON
          cat >"$RUNNER_TEMP/observer.ts" <<'TS'
          export default function(pi: any) {
            pi.on("session_start", (_: any, ctx: any) => {
              const models = ctx.modelRegistry.getAll().filter((model: any) => model.provider === "openai-codex-pro");
              process.stderr.write("ALIAS_REGISTRY_COUNT:" + models.length + "\n");
            });
          }
          TS
          printf '{"id":"probe","type":"get_state"}\n' | "$OMP" \
            --mode rpc --no-ui --no-session --no-extensions \
            --extension "$RUNNER_TEMP/consumer/dist/index.js" \
            --extension "$RUNNER_TEMP/observer.ts" \
            >"$RUNNER_TEMP/rpc.jsonl" 2>"$RUNNER_TEMP/rpc.err"
          cat "$RUNNER_TEMP/rpc.err"
          grep -Eq '^ALIAS_REGISTRY_COUNT:[1-9][0-9]*$' "$RUNNER_TEMP/rpc.err"
          node - <<'NODE'
          const fs = require("fs");
          const frames = fs.readFileSync(process.env.RUNNER_TEMP + "/rpc.jsonl", "utf8")
            .trim().split("\n").map(JSON.parse);
          if (!frames.some(frame => frame.id === "probe" && frame.success === true)) {
            throw new Error("OMP did not complete the RPC state request");
          }
          NODE
